
name: "DevSecOpsBot Image Scanner"
description: "Scan container images"
author: "Sttor Security"

inputs:
  image:
    description: "Container image to scan"
    required: true
  post-url:
    description: "Backend URL to post results"
    required: false
    default: ""
  auth-token:
    description: "Auth token for backend"
    required: false
    default: ""
  server-token:
    description: "Server token for backend vulnerability database"
    required: false
    default: ""
  block-on-critical:
    description: "Block if critical vulnerabilities exceed threshold"
    required: false
    default: ""
  block-on-high:
    description: "Block if high+critical vulnerabilities exceed threshold"
    required: false
    default: ""
  block-on-any:
    description: "Block if any vulnerability exists"
    required: false
    default: ""
  block-on-secrets:
    description: "Block if secrets are found"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # OLD SETUP - DISABLED (get.trivy.dev unavailable)
    # - name: Setup Trivy
    #   uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241

    # NEW SETUP - Download directly from GitHub Releases
    - name: Setup Trivy
      shell: bash
      run: |
        set -euo pipefail

        VERSION="0.76.1"

        case "$(uname -m)" in
          x86_64) ARCH="64bit" ;;
          aarch64|arm64) ARCH="ARM64" ;;
          *) echo "Unsupported architecture"; exit 1 ;;
        esac

        ASSET="trivy_${VERSION}_Linux-${ARCH}.tar.gz"
        BASE="https://github.com/aquasecurity/trivy/releases/download/v${VERSION}"

        TMP_DIR="$(mktemp -d)"
        trap 'rm -rf "$TMP_DIR"' EXIT

        curl -fSL --retry 3 \
          "${BASE}/${ASSET}" \
          -o "${TMP_DIR}/${ASSET}"

        curl -fSL --retry 3 \
          "${BASE}/trivy_${VERSION}_checksums.txt" \
          -o "${TMP_DIR}/checksums.txt"

        EXPECTED="$(awk -v name="$ASSET" \
          '{file=$2; sub(/^\*/, "", file); if(file==name){print $1; exit}}' \
          "${TMP_DIR}/checksums.txt")"

        test -n "$EXPECTED"
        (cd "$TMP_DIR" && echo "$EXPECTED  $ASSET" | sha256sum -c -)

        tar -xzf "${TMP_DIR}/${ASSET}" -C "$TMP_DIR"

        mkdir -p "${RUNNER_TEMP}/trivy-bin"
        install -m 0755 "${TMP_DIR}/trivy" \
          "${RUNNER_TEMP}/trivy-bin/trivy"

        echo "${RUNNER_TEMP}/trivy-bin" >> "$GITHUB_PATH"

        "${RUNNER_TEMP}/trivy-bin/trivy" --version

    - name: Restore Trivy DB cache
      uses: actions/cache@v4
      with:
        path: .cache/trivy
        key: cache-trivy-${{ github.run_id }}
        restore-keys: cache-trivy-

    - name: Install dependencies
      run: pip install -r $GITHUB_ACTION_PATH/requirements.txt
      shell: bash

    - name: Run scanner
      run: python $GITHUB_ACTION_PATH/scanner.py "${{ inputs.image }}"
      shell: bash
      env:
        TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        POST_URL: ${{ inputs.post-url }}
        AUTH_TOKEN: ${{ inputs.auth-token }}
        SERVER_TOKEN: ${{ inputs.server-token }}
        BLOCK_ON_CRITICAL: ${{ inputs.block-on-critical }}
        BLOCK_ON_HIGH: ${{ inputs.block-on-high }}
        BLOCK_ON_ANY: ${{ inputs.block-on-any }}
        BLOCK_ON_SECRETS: ${{ inputs.block-on-secrets }}
